<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filipino Sign Language Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            padding: 30px 0;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: white;
            border: none;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s;
            color: #667eea;
        }
        
        .tab-btn.active {
            background: #667eea;
            color: white;
            transform: translateY(-5px);
        }
        
        .tab-btn:hover:not(.active) {
            background: #f0f0f0;
        }
        
        .tab-content {
            display: none;
            background: white;
            border-radius: 0 0 20px 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .tab-content.active {
            display: block;
        }
        
        .model-selector {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .model-selector label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .model-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
        }
        
        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragging {
            background: #e8ebff;
            border-color: #667eea;
        }
        
        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 20px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-block;
        }
        
        .btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-container {
            margin: 30px 0;
            text-align: center;
        }
        
        #imagePreview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            text-align: center;
        }
        
        .result.show {
            display: block;
            animation: slideIn 0.5s;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .prediction-main {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .confidence {
            font-size: 1.5em;
            opacity: 0.9;
        }
        
        .top-predictions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.3);
        }
        
        .top-pred-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            margin: 5px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
        }
        
        .webcam-container {
            position: relative;
            max-width: 640px;
            margin: 0 auto 30px;
            display: inline-block;
        }
        
        .video-wrapper {
            position: relative;
            display: inline-block;
        }
        
        #webcam {
            display: block;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .webcam-controls {
            text-align: center;
            margin: 20px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status.warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .live-prediction {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
            z-index: 10;
        }
        
        .live-prediction h3 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .live-confidence {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .center-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤟 Filipino Sign Language Recognition</h1>
            <p class="subtitle">Real-time FSL Recognition using Deep Learning</p>
        </header>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('upload')">📁 Upload Image</button>
            <button class="tab-btn" onclick="switchTab('webcam')">📹 Live Webcam</button>
        </div>
        
        <!-- Upload Tab -->
        <div id="upload-tab" class="tab-content active">
            <div class="model-selector">
                <label for="modelSelectUpload">Select Model:</label>
                <select id="modelSelectUpload">
                    <option value="resnet50">ResNet50 (Faster)</option>
                    <option value="resnet101">ResNet101 (More Accurate)</option>
                </select>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <h2>Drop your image here or click to browse</h2>
                <p style="margin-top: 10px; color: #666;">Supports PNG, JPG, JPEG</p>
                <input type="file" id="fileInput" accept="image/png,image/jpeg,image/jpg">
            </div>
            
            <div class="preview-container">
                <img id="imagePreview" style="display: none;">
            </div>
            
            <div style="text-align: center;">
                <button class="btn" id="predictBtn" style="display: none;">🔍 Predict Sign</button>
            </div>
            
            <div class="loading" id="uploadLoading">
                <div class="spinner"></div>
                <p>Analyzing your image...</p>
            </div>
            
            <div class="result" id="uploadResult">
                <h2>Prediction Result</h2>
                <div class="prediction-main" id="predictionText">-</div>
                <div class="confidence" id="confidenceText">Confidence: -</div>
                <div class="top-predictions">
                    <h3>Top 3 Predictions:</h3>
                    <div id="topPredictions"></div>
                </div>
            </div>
        </div>
        
        <!-- Webcam Tab -->
        <div id="webcam-tab" class="tab-content">
            <div class="model-selector">
                <label for="modelSelectWebcam">Select Model:</label>
                <select id="modelSelectWebcam">
                    <option value="resnet50">ResNet50 (Faster)</option>
                    <option value="resnet101">ResNet101 (More Accurate)</option>
                </select>
            </div>
            
            <div class="status info" id="webcamStatus">
                Click "Start Camera" to begin real-time recognition
            </div>
            
            <div class="center-container">
                <div class="webcam-container">
                    <div class="video-wrapper">
                        <video id="webcam" autoplay playsinline></video>
                        <canvas id="overlayCanvas"></canvas>
                    </div>
                    <div class="live-prediction" id="livePrediction" style="display: none;">
                        <h3 id="liveSign">-</h3>
                        <div class="live-confidence" id="liveConf">-</div>
                    </div>
                </div>
            </div>
            
            <div class="webcam-controls">
                <button class="btn" id="startCameraBtn">📹 Start Camera</button>
                <button class="btn" id="stopCameraBtn" style="display: none; background: #dc3545;">⏹ Stop Camera</button>
            </div>
            
            <canvas id="canvas" style="display: none;"></canvas>
        </div>
    </div>
    
    <script>
        let webcamStream = null;
        let predictionInterval = null;
        let overlayCtx = null;
        
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }
        
        // Upload functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const predictBtn = document.getElementById('predictBtn');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragging');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragging');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragging');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });
        
        fileInput.addEventListener('change', handleFileSelect);
        
        function handleFileSelect() {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    predictBtn.style.display = 'inline-block';
                    document.getElementById('uploadResult').classList.remove('show');
                };
                reader.readAsDataURL(file);
            }
        }
        
        predictBtn.addEventListener('click', async () => {
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('model_choice', document.getElementById('modelSelectUpload').value);
            
            document.getElementById('uploadLoading').classList.add('show');
            document.getElementById('uploadResult').classList.remove('show');
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('predictionText').textContent = data.prediction;
                    document.getElementById('confidenceText').textContent = 
                        `Confidence: ${(data.confidence * 100).toFixed(2)}%`;
                    
                    const topPredDiv = document.getElementById('topPredictions');
                    topPredDiv.innerHTML = data.top_predictions.map(pred => 
                        `<div class="top-pred-item">
                            <span>${pred.class}</span>
                            <span>${(pred.confidence * 100).toFixed(2)}%</span>
                        </div>`
                    ).join('');
                    
                    document.getElementById('uploadResult').classList.add('show');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('uploadLoading').classList.remove('show');
            }
        });
        
        // Webcam functionality
        const startCameraBtn = document.getElementById('startCameraBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const webcam = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const overlayCanvas = document.getElementById('overlayCanvas');
        overlayCtx = overlayCanvas.getContext('2d');
        
        // Setup overlay canvas to match video
        webcam.addEventListener('loadedmetadata', () => {
            overlayCanvas.width = webcam.videoWidth;
            overlayCanvas.height = webcam.videoHeight;
        });
        
        startCameraBtn.addEventListener('click', async () => {
            try {
                webcamStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    } 
                });
                webcam.srcObject = webcamStream;
                
                startCameraBtn.style.display = 'none';
                stopCameraBtn.style.display = 'inline-block';
                document.getElementById('livePrediction').style.display = 'block';
                document.getElementById('webcamStatus').textContent = 'Camera active - Show your hand sign!';
                document.getElementById('webcamStatus').className = 'status success';
                
                // Start predictions at 3 FPS
                predictionInterval = setInterval(predictFromWebcam, 333);
            } catch (error) {
                document.getElementById('webcamStatus').textContent = 'Error: ' + error.message;
                document.getElementById('webcamStatus').className = 'status error';
            }
        });
        
        stopCameraBtn.addEventListener('click', () => {
            if (webcamStream) {
                webcamStream.getTracks().forEach(track => track.stop());
                webcamStream = null;
            }
            if (predictionInterval) {
                clearInterval(predictionInterval);
                predictionInterval = null;
            }
            
            // Clear overlay
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            
            startCameraBtn.style.display = 'inline-block';
            stopCameraBtn.style.display = 'none';
            document.getElementById('livePrediction').style.display = 'none';
            document.getElementById('webcamStatus').textContent = 'Camera stopped';
            document.getElementById('webcamStatus').className = 'status info';
        });
        
        async function predictFromWebcam() {
            if (!webcam.videoWidth || !webcam.videoHeight) return;
            
            canvas.width = webcam.videoWidth;
            canvas.height = webcam.videoHeight;
            ctx.drawImage(webcam, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            const formData = new FormData();
            formData.append('image', imageData);
            formData.append('model_choice', document.getElementById('modelSelectWebcam').value);
            
            try {
                const response = await fetch('/predict_webcam', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // Clear previous overlay
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                
                if (response.ok && data.hand_detected) {
                    // Draw bounding box
                    const bbox = data.bbox;
                    const color = data.confidence > 0.8 ? '#00ff00' : '#ffff00';
                    
                    // Scale bbox to canvas size
                    const scaleX = overlayCanvas.width / canvas.width;
                    const scaleY = overlayCanvas.height / canvas.height;
                    
                    const x = bbox.xmin * scaleX;
                    const y = bbox.ymin * scaleY;
                    const w = (bbox.xmax - bbox.xmin) * scaleX;
                    const h = (bbox.ymax - bbox.ymin) * scaleY;
                    
                    overlayCtx.strokeStyle = color;
                    overlayCtx.lineWidth = 4;
                    overlayCtx.strokeRect(x, y, w, h);
                    
                    // Draw label background
                    overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    overlayCtx.fillRect(x, y - 40, w, 35);
                    
                    // Draw label text
                    overlayCtx.fillStyle = color;
                    overlayCtx.font = 'bold 24px Arial';
                    overlayCtx.textAlign = 'center';
                    overlayCtx.fillText(data.prediction, x + w/2, y - 12);
                    
                    // Update live prediction display
                    document.getElementById('liveSign').textContent = data.prediction;
                    document.getElementById('liveConf').textContent = 
                        `${(data.confidence * 100).toFixed(1)}%`;
                    
                    // Update status
                    document.getElementById('webcamStatus').textContent = 
                        `Detected: ${data.prediction} (${(data.confidence * 100).toFixed(1)}%)`;
                    document.getElementById('webcamStatus').className = 'status success';
                    
                } else if (!data.hand_detected) {
                    document.getElementById('liveSign').textContent = 'No hand';
                    document.getElementById('liveConf').textContent = 'detected';
                    document.getElementById('webcamStatus').textContent = 
                        'No hand detected - Please show your hand to the camera';
                    document.getElementById('webcamStatus').className = 'status warning';
                }
            } catch (error) {
                console.error('Prediction error:', error);
                document.getElementById('webcamStatus').textContent = 'Prediction error: ' + error.message;
                document.getElementById('webcamStatus').className = 'status error';
            }
        }
    </script>
</body>
</html>
